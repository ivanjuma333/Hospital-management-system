<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IVAN</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color:whitesmoke;
            margin: 0;
            padding: 20px;
        }

        /* MAIN CONTAINER */

        .container {
            width: 850px;
            max-width: 100%;
            margin: 30px auto;
            background-color:antiquewhite;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        /* FORM HEADER AND LOGO */

        .header {
            position: relative;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: rgb(107, 69, 124);
            text-align: center;
            font-size: 25px;
            margin: 0;
        }

        /* HOSPITAL LOGO */

        .header img {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 85px;
            height: 85px;
            object-fit: contain;
        }

        /* FORM ROWS */

        .row {
            display: grid;
            gap: 20px;
            margin-bottom: 20px;
        }

        .two {
            grid-template-columns: 1fr 1fr;
        }

        .three {
            grid-template-columns: 1fr 1fr 1fr;
        }

        /* SECTION HEADINGS */

        .section-title {
            color: green;
            border-bottom: 2px solid maroon;
            padding-bottom: 5px;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 18px;
        }

        /* LABELS */

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        /* INPUTS */

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        input:focus, select:focus, textarea:focus {
            border: 1px solid maroon;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* RADIO OPTIONS */

        .gender, .radio-group {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 10px 0;
            flex-wrap: wrap;
        }

        .gender label,
        .radio-group label,
        .nested-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
        }

        .gender input,
        .radio-group input,
        .nested-options input {
            width: auto;
        }

        /* PAYMENT DETAILS */

        .nested-options {
            display: none;
            margin-top: 15px;
            padding: 20px;
            border-left: 4px solid maroon;
            background-color: #f9f9f9;
            border-radius: 5px;
        }

        .nested-options h3 {
            color: maroon;
            margin-top: 0;
        }

        .nested-options > label {
            display: block;
            margin-top: 15px;
        }

        .nested-options input[type="text"],
        .nested-options input[type="date"] {
            width: 100%;
            margin-top: 5px;
        }

        /* MOBILE PROVIDERS */

        .mobile-providers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .mobile-providers label {
            padding: 12px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .mobile-providers input {
            width: auto;
        }

        /* BUTTONS */

        .buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 13px 25px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .register {
            background-color: maroon;
        }

        .reset {
            background-color: #555;
        }

        button:hover {
            opacity: 0.8;
        }

        /* MOBILE RESPONSIVENESS */

        @media screen and (max-width: 600px) {

            .container {
                padding: 20px;
            }

            .two, .three, .payment-fields {
                grid-template-columns: 1fr;
            }

            .header {
                min-height: 85px;
            }

            .header h2 {
                font-size: 16px;
                padding-right: 65px;
            }

            .header img {
                width: 60px;
                height: 60px;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .mobile-providers {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body

<div class="container">

    <!-- FORM TITLE AND HOSPITAL LOGO -->

    <div class="header">

        <h2>IVAN</h2>

        <img src="images/hhoosspital.png"
             alt="Hospital Patient Logo">

    </div>

    <form id="patientForm">

        <!-- PATIENT ID AND REGISTRATION DATE -->

        <div class="row two">

            <div>
                <label>Patient ID (NHIF Card No.)</label>

                <input type="text"
                       name="patient_id"
                       placeholder="Enter Patient ID"
                       required>
            </div>

            <div>
                <label>Registration Date</label>

                <input type="date"
                       name="registration_date"
                       required>
            </div>

        </div>

        <!-- PATIENT NAME -->

        <label>Patient Name</label>

        <div class="row three">

            <input type="text"
                   name="first_name"
                   placeholder="First Name"
                   required>

            <input type="text"
                   name="surname"
                   placeholder="Surname"
                   required>

            <input type="text"
                   name="middle_name"
                   placeholder="Middle Name">

        </div>

        <!-- GENDER AND BIRTH DATE -->

        <div class="row two">

            <div>

                <label>Gender</label>

                <div class="gender">

                    <label>
                        <input type="radio"
                               name="gender"
                               value="Male"
                               required>
                        Male
                    </label>

                    <label>
                        <input type="radio"
                               name="gender"
                               value="Female">
                        Female
                    </label>

                </div>

            </div>

            <div>

                <label>Birth Date</label>

                <input type="date"
                       name="birth_date"
                       required>

            </div>

        </div>

        <!-- ADDRESS -->

        <label>Address</label>

        <div class="row">

            <input type="text"
                   name="street_address"
                   placeholder="Street Address">

        </div>

        <!-- CITY, REGION AND COUNTRY -->

        <div class="row three">

            <input type="text"
                   name="city"
                   placeholder="City">

            <select name="region">

                <option value="">Select Region</option>
                <option>Dar es Salaam</option>
                <option>Arusha</option>
                <option>Dodoma</option>
                <option>Mwanza</option>
                <option>Morogoro</option>
                <option>Mbeya</option>
                <option>Iringa</option>
                <option>Kilimanjaro</option>
                <option>Tanga</option>
                <option>Tabora</option>
                <option>Shinyanga</option>
                <option>Songea</option>
                <option>Ruvuma</option>
                <option>Geita</option>
                <option>Bukoba</option>
                <option>Njombe</option>
                <option>Pwani</option>

            </select>

            <select name="country">

                <option value="">Select Country</option>
                <option>Tanzania</option>
                <option>Kenya</option>
                <option>Uganda</option>
                <option>Rwanda</option>
                <option>Burundi</option>
                <option>Other</option>

            </select>

        </div>

        <!-- PHONE NUMBER -->

        <div class="row">

            <div>

                <label>Patient's Phone Number</label>

                <input type="tel"
                       name="phone"
                       placeholder="Enter Phone Number"
                       required>

            </div>

        </div>

        <!-- MEDICATION INFORMATION -->

        <h3 class="section-title">
            Medication Information
        </h3>

        <div class="row">

            <div>
                <label>Please list any medications you are currently taking</label>

                <textarea name="current_medications"
                          placeholder="Enter current medications..."></textarea>
            </div>

            <div>
                <label>Please list any allergies</label>

                <textarea name="allergies"
                          placeholder="Enter allergies..."></textarea>
            </div>

        </div>

        <!-- PHYSICIAN INFORMATION -->

        <h3 class="section-title">
            Primary Care Physician Information
        </h3>

        <div class="row three">

            <div>
                <label>Physician Name</label>

                <input type="text"
                       name="physician_name"
                       placeholder="Enter Physician Name">
            </div>

            <div>
                <label>Physician Room/Office No.</label>

                <input type="text"
                       name="physician_room_no"
                       placeholder="Room/Office No.">
            </div>

            <div>
                <label>Phone Number</label>

                <input type="tel"
                       name="physician_phone"
                       placeholder="Enter Phone Number">
            </div>

        </div>

        <!-- METHODS OF PAYMENT -->

        <h3 class="section-title">Methods of Payment</h3>

        <div class="radio-group">

            <label>
                <input type="radio"
                       name="payment_method"
                       value="Cash"
                       onclick="togglePaymentOption(this)"
                       required>
                Cash
            </label>

            <label>
                <input type="radio"
                       name="payment_method"
                       value="Mobile Payment"
                       onclick="togglePaymentOption(this)">
                Mobile Payment
            </label>

        </div>

        <!-- CASH PAYMENT DETAILS -->

        <div id="cashOptions" class="nested-options">

            <h3>Cash Payment Details</h3>

            <label>Amount Paid (TSh)</label>

            <input type="text"
                   name="amount_paid"
                   placeholder="Example: 10,000"
                   inputmode="numeric"
                   oninput="formatMoney(this)">

            <label>Receiver's Name</label>

            <input type="text"
                   name="cash_receiver"
                   placeholder="Enter Receiver's Name">

            <label>Payment Date</label>

            <input type="date"
                   name="cash_payment_date">

        </div>

        <!-- MOBILE PAYMENT DETAILS -->

        <div id="mobileOptions" class="nested-options">

            <h3>Mobile Payment Options</h3>

            <label>Select Mobile Payment Provider</label>

            <div class="mobile-providers">

                <label>
                    <input type="radio"
                           name="mobile_provider"
                           value="Selcom">
                    Selcom
                </label>

                <label>
                    <input type="radio"
                           name="mobile_provider"
                           value="M-Pesa">
                    M-Pesa
                </label>

                <label>
                    <input type="radio"
                           name="mobile_provider"
                           value="Mixx by Yas">
                    Mixx by Yas
                </label>

                <label>
                    <input type="radio"
                           name="mobile_provider"
                           value="Airtel Money">
                    Airtel Money
                </label>

                <label>
                    <input type="radio"
                           name="mobile_provider"
                           value="HaloPesa">
                    HaloPesa
                </label>

            </div>

        </div>

        <!-- REGISTER AND RESET BUTTONS -->

        <div class="buttons">

            <button type="submit" class="register">
                Register Patient
            </button>

            <button type="reset" class="reset">
                Reset
            </button>

        </div>

    </form>

</div>

<!-- JAVASCRIPT -->

<script>

    let lastPaymentMethod = "";

    function togglePaymentOption(option) {

        const cashOptions = document.getElementById("cashOptions");
        const mobileOptions = document.getElementById("mobileOptions");

        if (lastPaymentMethod === option.value) {

            setTimeout(function () {

                option.checked = false;

                cashOptions.style.display = "none";
                mobileOptions.style.display = "none";

                document.querySelectorAll('input[name="mobile_provider"]')
                    .forEach(input => input.checked = false);

                lastPaymentMethod = "";

            }, 0);

            return;
        }

        lastPaymentMethod = option.value;

        cashOptions.style.display =
            option.value === "Cash" ? "block" : "none";

        mobileOptions.style.display =
            option.value === "Mobile Payment" ? "block" : "none";

        if (option.value === "Cash") {

            document.querySelectorAll('input[name="mobile_provider"]')
                .forEach(input => input.checked = false);

        }
    }

    /* FORMAT MONEY */

    function formatMoney(input) {

        let value = input.value.replace(/,/g, "").replace(/\D/g, "");

        input.value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

    }

    /* REGISTER PATIENT */

    document.getElementById("patientForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const paymentMethod = document.querySelector(
                'input[name="payment_method"]:checked'
            );

            if (!paymentMethod) {

                alert("Please select a payment method.");
                return;

            }

            if (paymentMethod.value === "Mobile Payment") {

                const provider = document.querySelector(
                    'input[name="mobile_provider"]:checked'
                );

                if (!provider) {

                    alert("Please select a mobile payment provider.");
                    return;

                }
            }

            alert("Your patient has been registered successfully!");

            this.reset();

            lastPaymentMethod = "";

            showPaymentOptions();

        });

    /* RESET PAYMENT OPTIONS */

    function showPaymentOptions() {

        document.getElementById("cashOptions").style.display = "none";

        document.getElementById("mobileOptions").style.display = "none";

    }

    document.getElementById("patientForm")
        .addEventListener("reset", function() {

            lastPaymentMethod = "";

            setTimeout(showPaymentOptions, 0);

        });

</script>

</body>
</html>
